name: Java CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Java files
        run: |
          mkdir -p out
          javac -cp "lib/*" -d out $(find src -name "*.java")

      - name: Run tests
        run: |
          java -cp "out:lib/*" org.junit.platform.console.ConsoleLauncher --scan-class-path

      # ========== СБОРКА JAR ДЛЯ КЛИЕНТА ==========
      - name: Build fat JAR (Client GUI)
        run: |
          mkdir -p dist/client/tmp_classes
          mkdir -p dist/client/tmp_libs

          for jarfile in lib/*.jar; do
            unzip -o -q "$jarfile" -d dist/client/tmp_libs
          done

          cp -r out/* dist/client/tmp_classes/

          echo "Main-Class: uz.cherevichenko_sergey.cafe_order_system.MainGui" > dist/client/manifest.txt

          jar cfm dist/CafeOrderClient-GUI-fat.jar dist/client/manifest.txt \
            -C dist/client/tmp_libs . -C dist/client/tmp_classes .

      # ========== СБОРКА JAR ДЛЯ СЕРВЕРА ==========
      - name: Build fat JAR (Server GUI)
        run: |
          mkdir -p dist/server/tmp_classes
          mkdir -p dist/server/tmp_libs

          for jarfile in lib/*.jar; do
            unzip -o -q "$jarfile" -d dist/server/tmp_libs
          done

          cp -r out/* dist/server/tmp_classes/

          echo "Main-Class: uz.cherevichenko_sergey.cafe_order_system.CafeOrderServerGuiMain" > dist/server/manifest.txt

          jar cfm dist/CafeOrderServer-GUI-fat.jar dist/server/manifest.txt \
            -C dist/server/tmp_libs . -C dist/server/tmp_classes .

      # ========== ЗАГРУЗКА АРТЕФАКТОВ ==========
      - name: Upload Client GUI JAR
        uses: actions/upload-artifact@v4
        with:
          name: CafeOrderClient-GUI-fat-jar
          path: dist/CafeOrderClient-GUI-fat.jar

      - name: Upload Server GUI JAR
        uses: actions/upload-artifact@v4
        with:
          name: CafeOrderServer-GUI-fat-jar
          path: dist/CafeOrderServer-GUI-fat.jar
