name: Java CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Java files
        run: |
          mkdir -p out
          javac -cp "lib/*" -d out $(find src -name "*.java")

      - name: Run tests
        run: |
          java -cp "out:lib/*" org.junit.platform.console.ConsoleLauncher --scan-class-path

      - name: Create JAR file
        run: |
          mkdir -p dist
          echo "Main-Class: uz.cherevichenko_sergey.cafe_order_system.MainClass" > manifest.txt
          jar cfm dist/CafeOrderSystem.jar manifest.txt -C out .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CafeOrderSystem
          path: dist/
